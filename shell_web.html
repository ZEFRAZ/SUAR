<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>S U A R — Proyek Animasi Mercusuar & Kapal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="icon.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at center, #13243b 0%, #080d16 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #d8e5f5;
        }

        .game-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
        }

        canvas.emscripten {
            border: 2px solid rgba(80, 180, 255, 0.35);
            border-radius: 12px;
            background-color: #000;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.8), 0 0 35px rgba(0, 150, 255, 0.15);
            outline: none;
            display: block;
            cursor: default;
        }

        .footer-bar {
            margin-top: 10px;
            font-size: 13px;
            letter-spacing: 0.5px;
            color: rgba(200, 225, 255, 0.6);
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .footer-badge {
            background: rgba(255, 255, 255, 0.08);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        #output {
            display: none;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>

    <div class="footer-bar">
        <span class="footer-badge">🔊 Klik pada kanvas untuk mengaktifkan audio</span>
        <span class="footer-badge">⌨️ [W] Wireframe &nbsp;|&nbsp; [Spasi] Pause &nbsp;|&nbsp; [H] HUD</span>
    </div>

    <p id="output"></p>

    <script>
        var Module = {
            print: (function() {
                var element = document.getElementById('output');
                if (element) element.value = '';
                return function(text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                    console.log(text);
                };
            })(),
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                return canvas;
            })()
        };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
